<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Sfeed — 연결을 기다리고 있어요</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#020617;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:420px;padding:32px;text-align:center}img{width:72px;height:72px;border-radius:20px}h1{font-size:23px;margin:28px 0 14px;word-break:keep-all}p{font-size:15px;color:#94a3b8;line-height:1.9;word-break:keep-all}button{border:0;border-radius:12px;padding:14px 24px;margin-top:16px;background:#10b981;color:#020617;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #f1f5f9;outline-offset:4px}
  </style>
  <script src="/offline.js" defer></script>
</head>
<body><main>
  <img src="/icons/icon-192.png" alt="Sfeed">
  <h1>인터넷 연결을 기다리고 있어요</h1>
  <p>인터넷에 연결하면 구독한 피드와 저장한 글을 다시 불러올 수 있어요.</p>
  <button type="button">다시 연결하기</button>
</main></body>
</html>
